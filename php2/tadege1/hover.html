<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrollable Header Example</title>
  <style>
    body {
      background-color: aqua;
      margin: 0;
      padding: 0;
    }

    .header {
      text-align: center;
      padding: 20px;
      width: 400px;
      height: 100px;           /* fixed height */
      margin: 50px auto;
      background-color: white;
      overflow-y: auto;        /* enables vertical scroll */
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 22px;
      line-height: 1.4;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      INJIBARA UNIVERSITY<br>
      STUDENT INFORMATION MANAGEMENT SYSTEM<br>
      Scroll inside this header<br>
      Scroll inside this header<br>
      Scroll inside this header<br>
      Scroll inside this header<br>
      Scroll inside this header<br>
      Scroll inside this header<br>
      Scroll inside this header<br>
      Scroll inside this header
    </h1>
  </div>
</body>
</html>
