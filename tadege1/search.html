<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Search Student</title>
    <link rel="stylesheet" href="css.css">
</head>

<body>

<div class="first">
    <div class="second">
        <img src="logoinu.jpg" width="100" height="100">
    </div>
    <div class="third">
        <h1>INJIBARA UNIVERSITY<br>STUDENT INFORMATION MANAGEMENT SYSTEM</h1>
    </div>
</div>

<div class="fivth">
    <a href="a.html">HOME</a>
    <a href="B.html">CONTACT US</a>
    <a href="C.html">NEWS</a>
</div>

<h2>Search Student</h2>

<label>Enter Student ID or Email:</label><br>
<input type="text" id="searchKey" placeholder="ID or Email" required>
<input type="button" value="SEARCH" onclick="searchStudent()">
<br><br>

<table border="1" cellpadding="10" id="resultTable" style="display:none;">
    <thead>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
            <th>ID</th>
            <th>Gender</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
            <th>Year</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
function searchStudent() {
    let key = document.getElementById("searchKey").value.trim();
    if (!key) return alert("Please enter ID or Email!");

    let list = JSON.parse(localStorage.getItem("students")) || [];

    // Search by ID or Email
    let student = list.find(s => s.id === key || s.email === key);

    if (!student) {
        alert("No student found!");
        document.getElementById("resultTable").style.display = "none";
        return;
    }

    // Display result in table
    let tbody = document.querySelector("#resultTable tbody");
    tbody.innerHTML = `
        <tr>
            <td>${student.firstname}</td>
            <td>${student.lastname}</td>
            <td>${student.age}</td>
            <td>${student.id}</td>
            <td>${student.gender}</td>
            <td>${student.email}</td>
            <td>${student.phone}</td>
            <td>${student.department}</td>
            <td>${student.year}</td>
        </tr>
    `;

    document.getElementById("resultTable").style.display = "table";
}
</script>

</body>
</html>
