<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
    <table border="0" width="500px">
        <tr>
            <td><label>First name</label></td>
            <td><input type="text" name="fname"></td> 
        </tr>
        <tr>
            <td><label>Last name</label></td>
            <td><input type="text" name="lname"></td>
        </tr>
        <tr>
            <td><label>Email</label></td> 
            <td><input type="email" name="email">
                <div>Your email address will be your username</div>
            </td>
        </tr>
        <tr>
            <td><label>Retype email</label></td>
            <td><input type="email"></td>
        </tr>
        <tr>
            <td><label>Password</label></td>
            <td><input type="password">
                <div>(min 8 characters, 1 number, case sensitive)</div>
            </td>
        </tr>
        <tr>
            <td><label>Re-type password</label></td>
            <td><input type="password"></td>
        </tr>
        <tr>
            <td><label>Address</label></td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td><label>City</label></td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td><label>State</label></td>
            <td>
                <select name="state">
                    <option value="Choose a state">Choose a state</option>
                    <option value="amhara">Amhara</option>
                    <option value="tigray">Tigray</option>
                </select>
            </td>
        </tr>
        <tr>
            <td><label>Zip code</label></td>
            <td>
                <input type="text" size="5">
                <input type="text" placeholder="optional">
            </td>
        </tr>
        <tr>
            <td><label>Phone</label></td>
            <td>
                <input type="number" size="5">
              
                <select name="Mobile">
                    <option value="faa">mobile</option>
                    <option value="Mobile">gfgj</option>
                </select>
                  <div>No space or dash</div>
            </td>
        </tr>
        <tr>
            <td><label>date of birth</label></td>
            <td>
                <select name="month" >
                    <option value="month">month</option>
                     <option value="month">month</option>
                </select>
                <select name="day" >
                    <option value="day">day</option>
                     <option value="month">month</option>
                </select>
                <select name="year" >
                    <option value="month">year</option>
                     <option value="month">month</option>
                </select>
                
            </td>
        </tr>
        <tr>
            <td>
                <label>gender</label>
            </td>
            <td>
            <select name="choose gender">
                <option value="chose">choose asecurity question</option>
                 <option value="chose">choose asecurity</option>
            </select>

            </td>
        </tr>
        <tr>
            <td>
                <label>security answer</label>
            </td>
            <td><input type="text"><div>not casesentetive</div></td>
        </tr>
    </table>
    </fieldset>
</body>
</html>
