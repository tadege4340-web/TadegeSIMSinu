<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css.css">
</head>

<body>

<div class="first">
    <div class="second">
        <img src="logoinu.jpg" width="100" height="100">
    </div>
    <div class="third">
        <h1>INJIBARA UNIVERSITY<br>STUDENT INFORMATION MANAGEMENT SYSTEM</h1>
    </div>
</div>

<div class="fivth">
    <a href="a.html">HOME</a>
    <a href="B.html">CONTACT US</a>
    <a href="C.html">NEWS</a>
</div>
<h2>Student List</h2>

<table border="1" cellpadding="10" id="studentTable">
    <thead>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
            <th>ID</th>
            <th>Gender</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
            <th>Year</th>
        </tr>
    </thead>

    <tbody>
    </tbody>
</table>

<script>
function loadStudents() {
    let list = JSON.parse(localStorage.getItem("students")) || [];
    let tbody = document.querySelector("#studentTable tbody");

    tbody.innerHTML = "";  // clear table

    list.forEach(student => {
        let row = `
            <tr>
                <td>${student.firstname}</td>
                <td>${student.lastname}</td>
                <td>${student.age}</td>
                <td>${student.id}</td>
                <td>${student.gender}</td>
                <td>${student.email}</td>
                <td>${student.phone}</td>
                <td>${student.department}</td>
                <td>${student.year}</td>
            </tr>
        `;
        tbody.innerHTML += row;
    });
}

window.onload = loadStudents;
</script>

</body>
</html>
